<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legal Review Viewer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">Legal Review Viewer</div>
    <label id="dropzone" class="dropzone">
      <input id="file-input" type="file" accept=".xlsx,.csv" multiple hidden>
      <strong>Drop report here</strong>
      <span>or click to choose .xlsx / .csv</span>
    </label>
    <div id="upload-msg" class="upload-msg"></div>
    <div class="list-head">Reports</div>
    <ul id="report-list"></ul>
  </aside>

  <main id="main">
    <div id="empty" class="empty">
      <h2>No report selected</h2>
      <p>Upload a review spreadsheet on the left, or pick one from the list.</p>
    </div>
    <div id="report" hidden></div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
